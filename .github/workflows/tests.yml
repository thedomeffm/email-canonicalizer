name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pest:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - uses: ramsey/composer-install@v4.0.0

      - run: vendor/bin/pest

  lint:
    name: ECS, Rector & PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Lowest supported version, so the tools run where the library must still work.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: ramsey/composer-install@v4.0.0

      # None of these write changes.
      - run: vendor/bin/ecs check --no-progress-bar

      - run: vendor/bin/rector process --dry-run --no-progress-bar

      - run: vendor/bin/phpstan analyse --no-progress
